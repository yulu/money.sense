other = "捐款 — 不受 $80,000 顶限限制"

[tool_tax_sec_donations_note]
other = "向合格公益机构（IPC）捐款属于税务扣除，而非个人减免，因此不受 $80,000 减免顶限限制。当 CPF 和 SRS 填补因触及顶限而失去作用时，捐款依然可以继续减少税款。"

[tool_tax_relief_cpf_info]
other = "本人强制性公积金缴款——即从工资中扣除的部分，不含雇主缴款。55岁及以下的雇员缴交率为工资的 20%，以年度工资顶限 $102,000 为上限；因此工资达到或超过该顶限时为 $20,400（20% x $102,000）。55岁以上比率递减。月薪部分仅计至普通工资顶限：2025 年为 $7,400（2026年1月1日起为 $8,000）。"

[tool_tax_income_info]
other = "扣除公积金前的年度工作收入，包含津贴与花红。请分别填写夫妻双方各自的收入——税率级距及母亲的 WMCR 百分比均以此为计算基础。"

[tool_tax_donation_deduction_info]
other = "捐款金额乘以 250%。此金额在减免之前从收入中扣除，且不计入 $80,000 减免顶限。"

