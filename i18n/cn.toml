[tool_tax_relief_life_insurance]
other = "人寿保险减免"

[tool_tax_relief_life_insurance_info]
other = "仅当年度强制性雇员 CPF 缴款低于 $5,000 时才可申报，且上限为差额部分——因此此处的上限会随 CPF 金额上升而下降，CPF 达到 $5,000 后即为零。请填入已缴保费与保额 7% 中的较低者。健康险、住院险、重疾险、储蓄型及投资连结型保单的保费不符合条件。"
