[tool_tax_sibling_info]
other = "每位与你同住、或你为其支出 $2,000 以上供养费用的残障兄弟姐妹（含继兄弟姐妹）可减免 $5,500。可与其他共同供养的兄弟姐妹按约定分摊，因此两栏之和不必达到 $5,500，但合计不得超过。若他人已就同一位受养人申报其他减免，则不可申报。"

